spring:
  application:
    name: rewards-service
  datasource:
    url: jdbc:h2:mem:rewards;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.arjun.rewards.kafka.TransactionEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.arjun.rewards.kafka
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:set-me}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0

rewards:
  kafka:
    topic: reward-transactions

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/rewards
    username: ${DB_USER:rewards}
    password: ${DB_PASSWORD:rewards}
